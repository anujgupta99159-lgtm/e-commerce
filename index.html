<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Store</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>ALL IN ONE STORE</h1>

<input type="text" id="search" placeholder="Search products">

<select id="filter">
<option value="all">All</option>
<option value="fashion">Fashion</option>
<option value="electronics">Electronics</option>
</select>

<button id="themeToggle">🌙</button>

<button id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
</header>

<!-- Slider -->
<div class="slider">
<div class="slides">
<img src="https://cottonfolk.in/cdn/shop/files/Men_sLavenderPinstripeShirt.jpg?v=1732270479R">
<img src="https://cdn.mos.cms.futurecdn.net/t8DxZU65K3rL3Me6sxQUAA-1920-80.jpg">
<img src="https://tse3.mm.bing.net/th/id/OIP.NT8UeRkqaZkS7ZHo2ZQFNQHaFF?pid=Api&P=0&h=180">
</div>
</div>

<section class="products" id="products"></section>

<!-- Cart Sidebar -->
<div class="cart" id="cart">
<h2>Shopping Cart</h2>
<ul id="cartItems"></ul>
<h3>Total ₹<span id="total">0</span></h3>

<a href="checkout.html"><button>Checkout</button></a>
<button onclick="toggleCart()">Close</button>
</div>

<script src="products.js"></script>
<script src="script.js"></script>

</body>
</html>
